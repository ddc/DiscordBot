services:
  discordbot_alembic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discordbot_alembic
    restart: always
    init: true
    env_file: .env
    environment:
      DOCKER_BUILDKIT: 1
    networks:
      - postgres_network
    command: ["sh", "-c", "uv run --frozen --no-sync alembic upgrade head && touch /tmp/alembic_done && sleep infinity"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/alembic_done"]
      start_interval: 5s
      interval: 60s
      timeout: 5s
      retries: 12
      start_period: 120s

  discordbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - LOG_DIRECTORY=${LOG_DIRECTORY}
    container_name: discordbot
    restart: always
    env_file: .env
    volumes:
        - ./logs:${LOG_DIRECTORY}
    networks:
      - postgres_network
    depends_on:
      discordbot_alembic:
        condition: service_healthy
    command: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "src"]

networks:
  postgres_network:
    external: true
